name: Backend CI

on:
  push:
    branches: [ main ] 
    paths:
      - 'backend/**'
      - 'shared/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'shared/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10' # Using 3.10 consistently
    - name: Install Poetry
      run: pipx install poetry
    - name: Install dependencies
      # --sync ensures lock file consistency, --no-root because we test source
      # Explicitly install dev dependencies for linters/formatters
      run: poetry install --no-root --sync --with dev 
    - name: Run Ruff Linter Check
      run: poetry run ruff check . --config pyproject.toml
    - name: Run Ruff Formatter Check
      run: poetry run ruff format --check . --config pyproject.toml
    - name: Run Black Formatter Check
      run: poetry run black --check . --config pyproject.toml
    - name: Run Pytest
      run: poetry run pytest
      env:
        PYTHONPATH: /app # Ensures 'ggcast.shared' can be imported
overwrite_file_with_block
ggcast/.github/workflows/frontend-ci.yml
name: Frontend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - 'shared/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - 'shared/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18' 
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json 

    - name: Install dependencies
      run: npm ci 
    - name: Lint and Format Check
      run: npm run lint 
    - name: Build Project
      run: npm run build
read_files(["ggcast/frontend/package.json"])
